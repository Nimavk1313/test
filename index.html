<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanvasFlow</title>
    <link rel="stylesheet" href="style.css">
</head><body>
    <div id="editor-container">
        <div id="top-toolbar">
            <div class="breakpoint-switcher">
                <button id="desktop-view">Desktop</button>
                <button id="tablet-view">Tablet</button>
                <button id="mobile-view">Mobile</button>
            </div>
        </div>
        <div id="main-content">
            <div id="left-panel">
                <div id="add-elements-panel">
                    <h3>Add Elements</h3>
                    <div class="element" draggable="true" data-type="section">Section</div>
                    <div class="element" draggable="true" data-type="container">Container</div>
                    <div class="element" draggable="true" data-type="heading">Heading</div>
                    <div class="element" draggable="true" data-type="button">Button</div>
                    <div class="element" draggable="true" data-type="image">Image</div>
                    <div class="element" draggable="true" data-type="richtext">Rich Text</div>
                    <div class="element" draggable="true" data-type="columns">Columns</div>
                </div>
                <div id="layers-panel">
                    <h3>Layers</h3>
                    <ul id="layer-list"></ul>
                </div>
            </div>
            <div id="canvas-area">
                <iframe id="canvas" name="canvas"></iframe>
            </div>
            <div id="right-panel">
                <h3>Styles</h3>
                <div id="style-panel">
                    <div id="typography-style-section" class="style-section">
                        <h4>Typography</h4>
                        <div class="style-control">
                            <label for="font-size-input">Size</label>
                            <input type="text" id="font-size-input" placeholder="16px">
                        </div>
                        <div class="style-control">
                            <label for="color-input">Color</label>
                            <input type="color" id="color-input">
                        </div>
                    </div>
                    <div id="button-style-section" class="style-section">
                        <h4>Button Styles</h4>
                        <div class="style-control">
                            <label for="background-color-input">Background</label>
                            <input type="color" id="background-color-input">
                        </div>
                         <div class="style-control">
                            <label for="button-color-input">Text Color</label>
                            <input type="color" id="button-color-input">
                        </div>
                        <div class="style-control">
                            <label for="padding-input">Padding</label>
                            <input type="text" id="padding-input" placeholder="12px 24px">
                        </div>
                        <div class="style-control">
                            <label for="border-radius-input">Border Radius</label>
                            <input type="text" id="border-radius-input" placeholder="5px">
                        </div>
                    </div>
                    <div id="image-style-section" class="style-section">
                        <h4>Image Settings</h4>
                        <div class="style-control">
                            <label for="image-src-input">Source URL</label>
                            <input type="text" id="image-src-input" placeholder="https://...">
                        </div>
                         <div class="style-control">
                            <label for="image-alt-input">Alt Text</label>
                            <input type="text" id="image-alt-input" placeholder="Description">
                        </div>
                    </div>
                    <div id="spacing-style-section" class="style-section">
                        <h4>Spacing</h4>
                        <h5>Margin</h5>
                        <div class="four-way-control">
                           <input type="text" id="margin-top-input" placeholder="T">
                           <input type="text" id="margin-right-input" placeholder="R">
                           <input type="text" id="margin-bottom-input" placeholder="B">
                           <input type="text" id="margin-left-input" placeholder="L">
                        </div>
                        <h5>Padding</h5>
                        <div class="four-way-control">
                           <input type="text" id="padding-top-input" placeholder="T">
                           <input type="text" id="padding-right-input" placeholder="R">
                           <input type="text" id="padding-bottom-input" placeholder="B">
                           <input type="text" id="padding-left-input" placeholder="L">
                        </div>
                    </div>
                    <div id="no-element-selected">
                        <p>Select an element to style it.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="rich-text-toolbar">
        <button data-command="bold">B</button>
        <button data-command="italic">I</button>
        <button data-command="underline">U</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
