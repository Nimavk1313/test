<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanvasFlow</title>
    <link rel="stylesheet" href="style.css">
</head><body>
    <div id="editor-container">
        <div id="top-toolbar">
            <div class="breakpoint-switcher">
                <button id="desktop-view">Desktop</button>
                <button id="tablet-view">Tablet</button>
                <button id="mobile-view">Mobile</button>
            </div>
        </div>
        <div id="main-content">
            <div id="left-panel">
                <div id="add-elements-panel">
                    <h3>Add Elements</h3>
                    <div class="element" draggable="true" data-type="section">Section</div>
                    <div class="element" draggable="true" data-type="container">Container</div>
                    <div class="element" draggable="true" data-type="heading">Heading</div>
                    <div class="element" draggable="true" data-type="button">Button</div>
                    <div class="element" draggable="true" data-type="image">Image</div>
                    <div class="element" draggable="true" data-type="richtext">Rich Text</div>
                </div>
                <div id="layers-panel">
                    <h3>Layers</h3>
                    <ul id="layer-list"></ul>
                </div>
            </div>
            <div id="canvas-area">
                <iframe id="canvas" name="canvas"></iframe>
            </div>
            <div id="right-panel">
                <h3>Styles</h3>
                <div id="style-panel">
                    <div id="typography-style-section" class="style-section">
                        <h4>Typography</h4>
                        <div class="style-control">
                            <label for="font-size-input">Size</label>
                            <input type="text" id="font-size-input" placeholder="16px">
                        </div>
                        <div class="style-control">
                            <label for="color-input">Color</label>
                            <input type="color" id="color-input">
                        </div>
                    </div>
                    <div id="no-element-selected">
                        <p>Select an element to style it.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
